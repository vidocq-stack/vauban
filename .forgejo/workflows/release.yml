# Generated by Vidocq/ci/release-maven/bootstrap-workflows.sh
# Re-run that script if the project's io.vidocq.* deps change.
name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.1.0). Without -SNAPSHOT."
        required: true
      next_dev_version:
        description: "Next dev version (e.g. 0.2.0-SNAPSHOT). Must end with -SNAPSHOT."
        required: true
      vidocq_parent_release:
        description: "io.vidocq stable version (must be on Central)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      # NOTE: we use the GitHub mirror (vidocq-stack/ci) instead of
      # codeberg.org/Vidocq/ci because Codeberg rate-limits burst clones
      # of the same repo (504 Gateway Timeout) and the Forgejo runner does
      # not cache action repos. GitHub is the push-mirror of Codeberg
      # (sync_on_commit + 8h fallback) and serves the same content + tag.
      - uses: https://github.com/vidocq-stack/ci/release-maven@v1
        with:
          release-version:  ${{ inputs.release_version }}
          next-dev-version: ${{ inputs.next_dev_version }}
          overrides: |
            io.vidocq=${{ inputs.vidocq_parent_release }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          gpg-private-key:  ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase:   ${{ secrets.GPG_PASSPHRASE }}
          gpg-key-id:       ${{ secrets.GPG_KEY_ID }}
