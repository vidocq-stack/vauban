# Generated by Vidocq/ci/release-maven/bootstrap-workflows.sh
# Re-run that script if the project's io.vidocq.* deps change.
name: release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.1.0). Without -SNAPSHOT."
        type: string
        required: true
      next_dev_version:
        description: "Next dev version (e.g. 0.2.0-SNAPSHOT). Must end with -SNAPSHOT."
        type: string
        required: true
      dry_run:
        description: "Dry-run: build + sign + bundle without commit/tag/push/upload."
        type: choice
        required: true
        default: "false"
        options: ["false", "true"]
      auto_publish:
        description: "Promote: 'manual' (default; click Publish on Sonatype Portal) or 'auto' (publish + wait for repo1.maven.org)."
        type: choice
        required: true
        default: "manual"
        options: ["manual", "auto"]
      vidocq_parent_release:
        description: "io.vidocq stable version (must be on Central)"
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VIDOCQ_BOT_TOKEN }}

      - uses: https://codeberg.org/Vidocq/ci/release-maven@v1
        with:
          release-version:  ${{ inputs.release_version }}
          next-dev-version: ${{ inputs.next_dev_version }}
          dry-run:          ${{ inputs.dry_run }}
          # Map 'manual'/'auto' → 'false'/'true' so the action.yml input stays boolean.
          auto-publish:     ${{ inputs.auto_publish == 'auto' && 'true' || 'false' }}
          overrides: |
            io.vidocq=${{ inputs.vidocq_parent_release }}
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          gpg-private-key:  ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase:   ${{ secrets.GPG_PASSPHRASE }}
          gpg-key-id:       ${{ secrets.GPG_KEY_ID }}
