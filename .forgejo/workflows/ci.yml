# Test PR : vérifie que le mécanisme cross-repo de validation downstream fonctionne.
# Le fix du typo précédent est l'occasion de tester sans risquer de casser quoi que ce soit.

name: CI

# Le ci.yml est dédié au flux post-merge (push sur main).
# Les PR sont gérées par pr.yml qui builde + déploie en pr-staging
# et orchestre la validation cross-repo via le graphe de dépendances Vidocq.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Build & test
        run: mvn -B -ntp verify

  tck:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Install (skip tests)
        run: mvn -B -ntp install -DskipTests

      - name: CDI TCK 4.1 Lite
        run: mvn -B -ntp -pl vauban-tck-runner -Ptck test

  deploy:
    runs-on: ubuntu-latest
    needs: tck

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Install Maven 4
        run: |
          wget -q https://dlcdn.apache.org/maven/maven-4/4.0.0-rc-5/binaries/apache-maven-4.0.0-rc-5-bin.tar.gz
          tar -xzf apache-maven-4.0.0-rc-5-bin.tar.gz -C /opt
          echo "/opt/apache-maven-4.0.0-rc-5/bin" >> "$GITHUB_PATH"

      - name: Configure Maven credentials (Sonatype Central Portal)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${{ secrets.CENTRAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_TOKEN }}</password>
              </server>
              <server>
                <id>central-snapshots</id>
                <username>${{ secrets.CENTRAL_USERNAME }}</username>
                <password>${{ secrets.CENTRAL_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          # Pré-définit l'agent GPG en mode loopback pour que maven-gpg-plugin
          # puisse lui injecter la passphrase via --pinentry-mode loopback (cf.
          # profile 'release' du pom).
          echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf 2>/dev/null || \
            (mkdir -p ~/.gnupg && chmod 700 ~/.gnupg && echo 'allow-loopback-pinentry' > ~/.gnupg/gpg-agent.conf)
          gpgconf --kill gpg-agent || true

      - name: Deploy to Maven Central Portal
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease deploy -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "❌ Secret Forgejo manquant : SLACK_WEBHOOK_URL" >&2
            exit 1
          fi
          payload=$(node <<'JS'
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ❌ *Build CI échoué* — \`${process.env.REPO}\`@${process.env.REF}\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"


      - name: Notify Slack on success
        if: success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          set -euo pipefail
          # Silencieux si secret absent — un build success ne doit pas fail à cause du notify.
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "ℹ️ Secret SLACK_WEBHOOK_URL absent — notif success skipped"
            exit 0
          fi
          VERSION=$(mvn -q -DforceStdout -N -Dexpression=project.version help:evaluate 2>/dev/null || echo "?")
          export VERSION
          export SHORT_SHA="${SHA:0:7}"
          payload=$(node <<'JS'
          const msg = process.env.COMMIT_MSG || '';
          const subject = msg.split('\n')[0];
          const author = process.env.COMMIT_AUTHOR ? ` par *${process.env.COMMIT_AUTHOR}*` : '';
          process.stdout.write(JSON.stringify({
            text: `[ViBot]: ✅ *Build CI réussi* — \`${process.env.REPO}\`@${process.env.REF} (v${process.env.VERSION})\n> \`${process.env.SHORT_SHA}\`${author} — _${subject}_\n<${process.env.RUN_URL}|Voir le run>`
          }))
          JS
          )
          curl -fsS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "$payload"
