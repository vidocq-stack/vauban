name: CI

# Flux post-merge (push sur main). Les étapes communes (setup Maven/Java, TCK, deploy
# Central, notif Slack) sont mutualisées via les composite actions du repo Vidocq/ci.
# Les PR restent gérées par pr.yml.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Vidocq/ci/setup-maven@main
      - name: Build & test
        run: mvn -B -ntp verify

  tck:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: Vidocq/ci/setup-maven@main
      - name: CDI TCK 4.1 Lite
        uses: Vidocq/ci/run-tck@main
        with:
          module: vauban-tck-runner

  deploy:
    runs-on: ubuntu-latest
    needs: tck
    steps:
      - uses: actions/checkout@v4
      - uses: Vidocq/ci/setup-maven@main

      - name: Deploy to Maven Central
        uses: Vidocq/ci/deploy-maven@main
        with:
          central-username: ${{ secrets.CENTRAL_USERNAME }}
          central-password: ${{ secrets.CENTRAL_PASSWORD }}
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Notify Slack on failure
        if: failure()
        uses: Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}

      - name: Notify Slack on success
        if: success()
        uses: Vidocq/ci/notify-slack@main
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          repo: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          sha: ${{ github.sha }}
          commit-message: ${{ github.event.head_commit.message }}
          commit-author: ${{ github.event.head_commit.author.name }}
